services: 
    db:
        image: mariadb:10.11
        container_name: kasiconnect-db
        restart: unless-stopped
        environment:
            MARIADB_ROOT_PASSWORD: rootpassword
            MARIADB_DATABASE: kasi_connect
        ports:
            - "3307:3306"
        volumes:
        - kasiconnect-db-data:/var/lib/mysql
        - ./database/kasi_connect_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

    api:
        build:
            context: ./KasiConnect.Api
            dockerfile: Dockerfile
        container_name: kasiconnect-api
        restart: unless-stopped
        depends_on:
        - db
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ASPNETCORE_URLS: http://+:8080
            ConnectionStrings__DefaultConnection: server=db;database=kasi_connect;user=root;password=rootpassword;ConvertZeroDateTime=True;
        ports:
            - "8080:8080"

volumes:
    kasiconnect-db-data:   